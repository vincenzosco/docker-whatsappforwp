name: image

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # The server lives in WhatsappForWP: this job proves that the copy in server/
  # is still identical to the commit SOURCE_COMMIT names, before building an
  # image nobody could reproduce.
  sync:
    runs-on: ubuntu-latest
    outputs:
      app_commit: ${{ steps.read.outputs.app_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: deploy

      - name: Read the recorded adapter commit
        id: read
        working-directory: deploy
        run: echo "app_commit=$(tr -d '[:space:]' < server/SOURCE_COMMIT)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: vincenzosco/WhatsappForWP
          ref: ${{ steps.read.outputs.app_commit }}
          path: app

      - name: The copy must match the adapter
        working-directory: deploy
        run: node tools/sync.js --check --from ../app

  image:
    needs: sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=raw,value=app-${{ needs.sync.outputs.app_commit }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
