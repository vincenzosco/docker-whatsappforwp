# Added on top of docker-compose.yaml for a NAS behind a bore tunnel.
#
#   docker compose -f docker-compose.yaml -f docker-compose.nas.yaml up -d
#
# bore.pub grants a requested port when it is free, and the tunnel service below
# asks for the one in TUNNEL_PORT every time it starts. That is what keeps the
# address in the whatsappforwp-endpoint repository valid across a restart or a
# reboot. When the port has been taken by somebody else in the meantime, the
# service falls back to a random one instead of exiting, and - with GH_TOKEN set
# - republishes the new address by itself, so the phone finds the service
# without anyone running publish.js.
services:
  tunnel:
    image: ghcr.io/vincenzosco/docker-whatsappforwp-tunnel:latest
    # To build it here instead, comment out `image:` and uncomment the next two
    # lines.
    # build:
    #   context: .
    #   dockerfile: Dockerfile.tunnel
    container_name: whatsapp-bore
    restart: unless-stopped
    # Host networking is required: bore has to reach the adapter on the NAS
    # itself, and a bridge would put it on another network.
    network_mode: host
    env_file:
      - .env
    environment:
      BRIDGE_PORT: ${BRIDGE_PORT:-8585}
      TUNNEL_SERVER: ${TUNNEL_SERVER:-bore.pub}
      TUNNEL_PORT: ${TUNNEL_PORT:-0}
      ENDPOINT_AUTO_PUBLISH: ${ENDPOINT_AUTO_PUBLISH:-on}
      ENDPOINT_REPO: ${ENDPOINT_REPO:-vincenzosco/whatsappforwp-endpoint}
      # A GitHub token with write access to ENDPOINT_REPO. Empty keeps
      # publishing manual; env_file (.env) supplies it when it is set there.
      GH_TOKEN: ${GH_TOKEN:-}
    depends_on:
      - server
